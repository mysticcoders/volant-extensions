name: Catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target wasm32-unknown-unknown
      - name: Test, build and check committed modules
        run: ./build.sh --check
      - name: Build the catalog site
        run: tools/catalog.py site
      - name: Sign catalog.json
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CATALOG_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in site/catalog.json | base64 -w0 > site/catalog.json.sig
          openssl pkey -in "$key" -pubout -out public.pem
          base64 -d site/catalog.json.sig > signature.bin
          openssl pkeyutl -verify -pubin -inkey public.pem -rawin -in site/catalog.json -sigfile signature.bin
          rm signature.bin public.pem
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target wasm32-unknown-unknown
      - name: Test, build and check committed modules
        run: ./build.sh --check
      - name: Start an extension from each template and run its tests
        run: tools/new-extension.py --self-test
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install checksum-verified cargo-deny 0.20.2
        run: |
          curl -fsSL --retry 3 https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - name: Check Rust advisories, licenses, duplicate crates and sources
        run: '"$RUNNER_TEMP/cargo-deny" --locked check advisories licenses bans sources'
      - name: Audit the npm lockfile
        working-directory: npm
        run: npm audit --audit-level=low
      - name: Check third-party license notices
        run: tools/check-licenses.py
